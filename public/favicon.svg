<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>
  </defs>

  <!-- Left Green Hemisphere & Circuit Traces -->
  <g stroke="url(#favGreen)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Left Crescent -->
    <path d="M 30 6 A 26 26 0 0 0 30 58" />
    <!-- Upper Trace -->
    <path d="M 12 22 L 20 22 L 24 28 L 24 34" />
    <!-- Lower Trace -->
    <path d="M 12 42 L 18 42 L 22 48 L 22 52" />
    <!-- Center Left Trace -->
    <path d="M 28 14 L 28 38 L 22 44" />
  </g>
  <!-- Green Node Pads -->
  <circle cx="12" cy="22" r="2.2" fill="#080C14" stroke="url(#favGreen)" stroke-width="2" />
  <circle cx="12" cy="42" r="2.2" fill="#080C14" stroke="url(#favGreen)" stroke-width="2" />
  <circle cx="22" cy="52" r="2" fill="url(#favGreen)" />
  <circle cx="24" cy="34" r="2" fill="url(#favGreen)" />

  <!-- Right Blue Hemisphere & Circuit Traces -->
  <g stroke="url(#favBlue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Right Crescent -->
    <path d="M 34 6 A 26 26 0 0 1 34 58" />
    <!-- Upper Trace -->
    <path d="M 36 12 L 40 18 L 40 28" />
    <!-- Center Right Trace -->
    <path d="M 52 24 L 46 24 L 42 32 L 42 42" />
    <!-- Lower Trace -->
    <path d="M 52 42 L 44 42 L 38 48" />
  </g>
  <!-- Blue Node Pads -->
  <circle cx="40" cy="18" r="2" fill="url(#favBlue)" />
  <circle cx="52" cy="24" r="2.2" fill="#080C14" stroke="url(#favBlue)" stroke-width="2" />
  <circle cx="52" cy="42" r="2.2" fill="#080C14" stroke="url(#favBlue)" stroke-width="2" />
  <circle cx="38" cy="48" r="2" fill="url(#favBlue)" />
</svg>
